# Les secrets sont saisis dans le dashboard Render (sync: false)
services:
  - type: web
    name: vite-et-gourmand
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      # nginx écoute sur 8080
      - key: PORT
        value: "8080"
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: MAILER_DSN
        sync: false
      - key: DEFAULT_URI
        sync: false
